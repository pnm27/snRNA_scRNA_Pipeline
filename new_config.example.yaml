# Genomes, barcodes, regions and tool versions
references:
  barcodes:
    - &3v3 whitelists/3M-february-2018.txt
    - &3v4 whitelists/3M-3pgex-may-2023_TRU.txt
    - &5v3 whitelists/3M-5pgex-jan-2023.txt
    - &3v2 whitelists/737K-august-2016.txt
    - &3v1 whitelists/737K-april-2014_rc.txt
    - &multiome whitelists/737K-arc-v1.txt
    - &atac whitelists/3M-february-2018.txt
    - &3lt whitelists/9K-LT-march-2021.txt
    - &fixedrna whitelists/737K-fixed-rna-profiling.txt
  genome_builds:
    gencode38: &gen38
      gtf: references/Homo_sapiens.GRCh38.104.gtf
      fasta: references/Homo_sapiens.GRCh38.dna.primary_assembly.fa
      gene_info_file: gene_annotations/Hs_allchr_MT.txt
      flat_ref: gene_annotations/refFlat_104_wo_chr.txt
    gencode44: &gen44
      gtf: references/gencode.v44.primary_assembly.annotation.gtf
      fasta: references/GRCh38_gencode44.primary_assembly.genome.fa
      gene_info_file: gene_annotations/all_genes_EnsemblInfo_110.csv
      flat_ref: gene_annotations/refFlat_v44.txt
  STARsolo_genome_dir:
    gencode38o150: &gencode38o150
      <<: *gen38
      genome: references/STAR_genome_dirs/Hs_GRCh38/star_279a_gen_150o
      overhang: 150

    gencode38o89: &gencode38o89
      <<: *gen38
      genome: references/STAR_genome_dirs/Hs_GRCh38/star_275b_gen_89o
      overhang: 89

    gencode38o90: &gencode38o90
      <<: *gen38
      genome: references/STAR_genome_dirs/Hs_GRCh38/star_279a_gen_90o
      overhang: 90

    gencode38o149: &gencode38o149
      <<: *gen38
      genome: references/STAR_genome_dirs/Hs_GRCh38/star_279a_gen_149o
      overhang: 149

    gencode44o89: &gencode44o89
      <<: *gen44
      genome: references/STAR_genome_dirs/Hs_GRCh38/star_2710a_gencode44_89o
      overhang: 89

    gencode44o149: &gencode44o149
      <<: *gen44
      genome: references/STAR_genome_dirs/Hs_GRCh38/star_2710a_gencode44_149o
      overhang: 149


  cellranger_arc_genome_dir:
    gencode44: &cellR_gen44
      genome: references/cellranger_GRCh38_Gencode_44

    gencode38: &cellR_gen38
      genome: references/cellranger_GRCh38_Gencode_38
  cellranger_genome_dir:
    gex2024: &cellR_gex2024
      genome: references/refdata-gex-GRCh38-2024-A
  whitelist: *3v3
  reg_chr_bed: references/Homo_sapiens_GRCh38_reg_chr.bed
  chr_prefix: null
  mito_prefix: MT-
  tools:
    star: star/2.7.10a
    featuremap_script: projdir/kite/featuremap/featuremap.py
    star_snv_aware: star/2.7.10a
    cellranger_arc: cellranger-arc/2.0.2
    cellranger: cellranger/8.0.1

# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: align
  picard_metrics: all  # can be null, all, rnaseq or gc
  gt_check: yes # yes or no

# What was sequenced and how it's multiplexed
experiment:
  inputs:
    select_fastqs: projdir/fastq_files.txt
    wildcards_select: null  # null when select_fastqs is not a dir otherwise provide wildcard(s) to extract
    fastqs_dir:
      HTO: projdir/fastq_files/
      cDNA: projdir/fastq_files/
      ATAC: projdir/fastq_files/
    R1_suffix: R1*fastq.gz
    R2_suffix: R2*fastq.gz
    multiome_suffix: .fastq.gz
    wet_lab_info: projdir/wet_lab_info.tsv
  hto:
    enabled: true
    multiplexing: single
  demultiplexing:
    method: solo
    add_to_previous: null
    run_tag: null
    genotype:
      enabled: false
      multi_vcf: false
    create_final_h5ad: true  # can be True, False or null
  qc:
    max_mito_percentage: 5
    min_genes_per_cell: 1000
    min_cells_per_gene: 10

# Parameters, output dirs and folder structures of each module
modules:
  STARsolo:
    fold_struct: "Sample_{pool}-cDNA/{pool}-cDNA"
    bams_dir: projdir/STARsolo_bams/
    genome_pick: *gencode38o89
    star_params_dir: projdir/STARsolo_params/
    # sjdboverhang: 89
    umi_len: 12
    soloType: CB_UMI_Simple
    solo_cell_filter: EmptyDrops_CR
    SAM_attr: NH HI AS nM NM MD CB UB CR UR CY UY GX GN sS sQ sM
    # WASP filtering of allele-specific mapping bias: needs a per-pool vcf in
    # 'gt_demux_pipeline: vcf_info' (adds vW to SAM_attr)
    wasp: false
    features: Gene GeneFull SJ Velocyto
    count_matrix: GeneFull # GeneFull (exons and introns, e.g. nuclei) or Gene (exons) for the steps after alignment
    misc_reads_file: _discarded_reads_stats.txt
    # Optional params
    bai: _Aligned.sortedByCoord.out.bam.bai
    bam: _Aligned.sortedByCoord.out.bam
    STAR_log_final: _Log.final.out
    barcodes_stats: _Solo.out/Barcodes.stats
    gene_features_stats: _Solo.out/Gene/Features.stats
    gene_barcodes: _Solo.out/Gene/filtered/barcodes.tsv.gz
    gene_features: _Solo.out/Gene/filtered/features.tsv.gz
    gene_matrix: _Solo.out/Gene/filtered/matrix.mtx.gz
    gene_raw_matrix: _Solo.out/Gene/raw/matrix.mtx
    gene_summary: _Solo.out/Gene/Summary.csv
    genefull_features_stats: _Solo.out/GeneFull/Features.stats
    genefull_barcodes: _Solo.out/GeneFull/filtered/barcodes.tsv.gz
    genefull_features: _Solo.out/GeneFull/filtered/features.tsv.gz
    genefull_matrix: _Solo.out/GeneFull/filtered/matrix.mtx.gz
    genefull_raw_matrix: _Solo.out/GeneFull/raw/matrix.mtx
    genefull_summary: _Solo.out/GeneFull/Summary.csv
    # extra_params: "--clip3pNbases 0 122   --soloBarcodeReadLength 150" # Example of adding more STARsolo command-line options
    extra_params: "--outReadsUnmapped Fastx" # or valid extra parameters in STARsolo, as above
    run_threads: 20
  cellranger:
    bams_dir: projdir/cellranger_count_outputs/
    ref: *cellR_gex2024
    include_introns: true # true for nuclei
    extra_params: null # or other cellranger count options
    # optional
    bam: possorted_genome_bam.bam
    bai: possorted_genome_bam.bam.bai
  cellranger_arc:
    bams_dir: projdir/cellranger_outputs/
    ref: *cellR_gen44
  # optional
    atac_fragments: atac_fragments.tsv.gz
    filtered_h5_matrix: filtered_feature_bc_matrix.h5
    gex_bam: gex_possorted_bam.bam
    gex_bai: gex_possorted_bam.bam.bai
    atac_bam: atac_possorted_bam.bam
    atac_bai: atac_possorted_bam.bam.bai
    pipestance_struct: "{pool}.mri.tgz"  # Pool represents the 'id' from the command line
  picard:
  # PICARD GcBias Metrics
    window_size: 100
    # Optional params
    gc_bias_metrics: _gc_bias_metrics.txt
    gc_summary_metrics: _summary_metrics.txt

    # PICARD RNAseq Metrics
    strand: NONE
    # Optional params
    rnaseq_metrics: _rnaseq_metrics.txt
  kite:
    fold_struct: "Sample_{pool}-HTO/"
    kallisto_bustools_dir: projdir/HTO_info/
    k_mer_length: 15
    chemistry: 10xv3
    columns_to_pick:
      - unique_sample_ID
      - hashtag
      - ab_barcode
    # Optional params
    feature_barcodes: FeatureBarcodes.csv
    headers: no
    features_mismatch_fa: FeaturesMismatch.fa
    features_mismatch_t2g: FeaturesMismatch.t2g
    features_mismatch_idx: FeaturesMismatch.idx
    ec_matrix: matrix.ec
    tx: transcripts.txt
    bus_file: output.bus
    bus_file_corrected: output_corrected.bus
    bus_file_sorted: output_sorted.bus
    bus_count_dir: bus_count_out/
    bus_count_barcodes: output.barcodes.txt
    bus_count_genes: output.genes.txt
    bus_count_mtx: output.mtx
  hashsolo:
    fold_struct: "{pool}/{pool}-HTO"
    h5ad_bustools_dir: projdir/cache/
    calico_solo_dir: projdir/demultiplex/solo/
    hto_sep: null
    columns_to_pick:
      - unique_sample_ID
      - hashtag
      - ab_barcode
      - SubID
    SubID_convert: false # If calico_solo SubID conversion needed (boolean)
    final_count_matrix_dir: projdir/final_count_matrix/solo/
    demultiplex_info_dir: projdir/demultiplex/info/solo/
    # Optional params
    bustools_h5ad: .h5ad
    calico_solo_h5ad: _STARsolo_out.h5ad
    final_count_matrix_h5ad: _STARsolo_out.h5ad
    demultiplex_info: _STARsolo_info.tsv
  gt_demux:
    fold_struct: "Sample_{pool}-cDNA/"
    fold_struct_filt_bc: "filt_bc_vireo_Sample_{pool}-cDNA"
    cellsnp_dir: projdir/demultiplex/cellSNP/
    inp_for_cellsnp_dir: projdir/demultiplex/inp_for_cellsnp/
    cellsnp_ref_snps: null #/path/to/ref_SNPs/for/subsetting
    reuse_cellsnp_dir: null # null or 'cellsnp_dir' of a previous run, to run vireo on its cellSNP outputs
    pool_vcf_use: [pileup, vireo] # what a per-pool vcf in 'vcf_info' is used for: cellSNP pileup and/or vireo
    vcf_info: projdir/pool_info.tsv
    vireosnp_dir: projdir/demultiplex/vireoSNP/
    filt_vcf_dir: projdir/isec_reruns/ # when subsetting SNPs wrt ref SNVs (from a source like 1kGP)
    genome_1k_ref: projdir/genome1K.phase3.SNP_AF5e2.chr1toX.hg38.sorted.vcf.gz
    donor_genotype: GT
    final_count_matrix_dir: projdir/final_count_matrix/vireoSNP/
    demultiplex_info_dir: projdir/demultiplex/info/vireoSNP/
    # Optional params
    # Donor Name conversion
    donorName_conv:
      file: null # null, If no name changes are needed otherwise a file
      header_lev: null # Specify the number of header levels
      pool_col: null # Column containing matched pool names
      donor_col: null # Column containing donor names (match demux output) to convert
      convert_col: null # Column containing converted names (corresponding to donor_col)
      new_h5ad_colname: null # New obs column

    demux_col: SubID_cs
    barcode_len: 16
    include_all_cells: yes
    doublet: Doublet
    negative: Negative
    na: Not Present
    filt_barcodes: filt_bc_vireo_
    cell_tag: CB
    umi_tag: UB
    cellsnp_base: cellSNP.base.vcf.gz
    cellsnp_cells: cellSNP.cells.vcf.gz
    bcftools_thread: 6
    min_aggr_count: 20
    min_maf: 0.1
    n_proc: 20
    donors_per_pool_file: null # values: null, vcf.gz file
    donors_vcf: GT_donors.vireo.vcf.gz
    donors_classification: donor_ids.tsv
    filt_vcf: filt.vcf.gz
    hash_columns:
      - SubID
      - Orig_VCF_ID
      - Samples
    vcf_info_columns:
      pool: SetNumber
      n_dons: Gt_count
      vcf: # Can contain null, list of column names (multi-vcf) or column containing vcf
        - pool_vcf
        - pool_vcf_gencode
        - pool_vcf_gencode_maf_25pct
    wet_lab_file_cols:
      - Set_number
      - unique_sample_ID
    vireo_donor_file_cols:
      - cell
      - donor_id
    final_count_matrix_h5ad: _STARsolo_vS_out.h5ad
    demultiplex_info: _STARsolo_vS_info.tsv
  demultiplex:
    fold_struct: "{pool}"  # final h5ad of each pool
    demux_count_matrix_dir: projdir/final_count_matrix/final/
    final_count_matrix_h5ad: _final.h5ad
    demultiplex_info_dir: projdir/demultiplex/info/final/
    demultiplex_info: _final_info.tsv
    # For add_solo/add_vireo: run_tag of the earlier run with the other tool
    previous_run_tag: null
    # Pools whose final demultiplexing (and donor names) were confirmed, e.g.
    # by identify_swaps. One row per pool and donor; 'version_column' has
    # <tool>:<run_tag> (tool: solo, vireo or both; e.g. vireo:w_gt_2, or runs
    # of two tools: solo:hto,vireo:w_gt) and an empty 'donor_to' drops that donor
    swap_correction:
      file: null
      pool_column: null
      version_column: null
      donor_from: null
      donor_to: null
  split_bams:
    fold_struct_hash: "Sample-{pool}-cDNA"  # Used for bc_donor hash file, reads_barcodes file, and the split_bams script
    fold_struct_bams: "Sample_{pool}-cDNA/" # Used for per-barcode and per-donor bam files
    fold_struct_donor: "{donor}" # for donor bams and h5ads
    split_by: # Accepts 'vireo':[vs, vireo] or 'solo':[cs, calico, calico_solo, hashsolo]
      demux: vireo
      # raw: output of vireo or solo; h5ad: h5ad of that tool in this run;
      # final: final h5ad of the pool (e.g. after the swap correction)
      input: raw
      column: null # h5ad/final only; null: SubID_vs, SubID_cs or Donor_final
    min_cells_per_donor: 200
    subset_chr: 1 # Subset BAM files
    # These four dirs get a sub-folder: gt_check/ (gt_check: yes) or final/
    inp_split_bams_dir: projdir/inp_split_filt_bams/
    split_bams_dir: projdir/STARsolo_split_filt_bams/
    per_donor_split_log_dir: projdir/logs_per_donor/
    new_temp_dir: projdir/n_temp_d/
    bams_per_barcode_dir: projdir/temp_split_filt_bams/
    reads_v_barcodes_dir: projdir/reads_info/
    temp_dir: projdir/split_bams_temp/
    sort_temp_dir: projdir/bam_sort_temp/temp_bc/
    # overwrite: yes
    # split_bams_script_dir: projdir/split_filt_bams_scripts/
    donor_name_converter:
      file: null # Accepts files or null
      from_column: null # Accepts str (column in the above file) or null
      to_column: null # Accepts str (column in the above file) or null
    demux_suffixes:
      vireo: null # Accept str (e.g. vs, vireo, etc.) or null
      solo: null # Accept str (e.g. cs, calico_solo, etc.) or null
    # Optional params
    sort_cb_bam: _Aligned.sortedByCB.out.bam
    filt_bam: _filt.bam
    sort_cb_bai: _Aligned.sortedByCB.out.bam.bai
    sam: _Aligned.sortedByCB.out.sam
    bc_per_donor: 800
    time_per_donor: "02:00"
    short_bam: _chr1.bam
    mito_reads_file: _mito_reads_stats.txt  # or null
  identify_swaps:
    fold_struct: "{pool}_{donor}_{modality}"  # for qtltools-mbv
    mbv_inp: vireo_outs # value can be either 'vireo_outs' or 'snakemake-type' input file
    mbv_out_dir: outdir/qtltools_mbv/
    ref_vcf: outdir/reference.vcf.gz
    # Optional params
    mbv_suffix: .bamstat.txt
    mbv_extra_opt: "--filter-mapping-quality 150"  # null if no extra params needed for the run
  deeptools:
    fold_struct: "Sample-{pool}"
    multiBamSummary:
      bams_dir: path/to/STARsolo_bams/
      bam: _Aligned.sortedByCoord.out.bam
      outdir: path/to/multiBamSummary_out/
      # out_format: .bigwig # can be bigwig or bedgraph
      rep1_suffix: 1-cDNA
      rep2_suffix: 2-cDNA
      extra_params: null  # or valid extra parameters in deepTools' bamCompare
    plotCorrelation:
      outdir: path/to/plotCorrelation_out/
      corr_method: spearman
      plot_type: scatterplot
      out_fmt: .png

# Rule resources (override rules/resources.smk)
execution:
  resources: null
