# WASP needs a per-pool vcf (vcf_info here has none)
# fails: STARsolo's WASP mode needs a vcf column
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: align
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    genotype:
      multi_vcf: false

# Parameters, output dirs and folder structures of each module
modules:
  STARsolo:
    wasp: true
