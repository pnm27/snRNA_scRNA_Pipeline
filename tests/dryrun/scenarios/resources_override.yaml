# a 'resources' override from the config
# expect: vireoSNP
# resources: vireoSNP cpus_per_task=3 mem_mb=12345
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: demux
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: false

# Rule resources (override rules/resources.smk)
execution:
  resources:
    vireoSNP:
      cpus_per_task: 3
      mem_mb: 12345
