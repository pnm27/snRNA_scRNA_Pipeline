# per-donor bams for genotype checks (chr1 subset), in split_bams_dir/gt_check/
# donors: D1 D2
# expect: filt_chr_bams split_bams resolve_pool_targets
# absent: bamfilt_by_CB
# path: STARsolo_split_filt_bams/gt_check/Sample_P1-cDNA/D2.bam inp_split_filt_bams/gt_check/ _chr1.bam
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: split_bams
  picard_metrics: null
  gt_check: yes

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: false
