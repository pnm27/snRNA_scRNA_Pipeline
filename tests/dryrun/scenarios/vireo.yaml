# vireo demultiplexing without genotypes
# expect: demux_run_vireo demux_final vireoSNP cellSNP create_inp_cellSNP
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: demux
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: false
