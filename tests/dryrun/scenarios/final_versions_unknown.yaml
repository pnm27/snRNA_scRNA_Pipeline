# a version of the swap correction file that 'versions' doesn't name
# standalone:
# setup: rm projdir/fastq_files.txt
# setup: mkdir -p root && touch root/S1.bam root/S1.bam.bai
# setup: printf "pool\tbam\nS1\troot/S1.bam\n" > bams.tsv
# setup: printf "Sample\tDonor_name\tSolution\tVersion_used\nS1\tdonor2\tdonA\tw_gt_2\n" > swap.tsv
# fails: Demultiplex version 'w_gt_2' of the swap correction file isn't in 'swap_correction: versions' (has: w_gt)
workflow:
  start: split_bams
  until: split_bams
modules:
  demultiplex:
    swap_correction:
      file: swap.tsv
      pool_column: Sample
      version_column: Version_used
      donor_from: Donor_name
      donor_to: Solution
      versions: {w_gt: "vireo:w_gt"}
  split_bams:
    split_by:
      demux: vireo
      input: final
      external:
        pools: bams.tsv
