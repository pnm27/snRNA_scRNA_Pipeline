# multiome vireo (ATAC and cDNA)
# expect: cellranger_arc_count demux_run_vireo demux_final vireoSNP
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: cellranger_arc
  until: demux
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: false

# Parameters, output dirs and folder structures of each module
modules:
  gt_demux:
    fold_struct: "Sample_{pool}/{modality}/"
    fold_struct_filt_bc: "filt_bc_vireo_Sample_{pool}_{modality}"
