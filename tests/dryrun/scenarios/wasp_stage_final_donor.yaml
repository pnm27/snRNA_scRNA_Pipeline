# start: wasp with swap-corrected donors: the sample names table gives each
# demultiplexed donor its final donor and VCF ID; D2's bam is written as D3
# (and D3's as D2). The bams stay in their pool's folder, so P2's D3 (its
# donor D1) doesn't overwrite P1's
# standalone:
# setup: rm projdir/fastq_files.txt
# setup: mkdir -p bams && touch chip_chr1.vcf.gz chip_chr2.vcf.gz && printf "chr1\t248956422\nchr2\t242193529\nchrM\t16569\n" > chrom.txt
# setup: for d in D1 D2 D3 P2_D1; do touch bams/$d.bam bams/$d.bam.bai; done
# setup: printf "pool\tdonor\tbam\nP1\tD1\tbams/D1.bam\nP1\tD2\tbams/D2.bam\nP1\tD3\tbams/D3.bam\nP2\tD1\tbams/P2_D1.bam\n" > wasp_samples.tsv
# setup: printf "pool\tdonor\tfinal_donor\tvcfID\nP1\tD1\tD1\tSUBJ_01\nP1\tD2\tD3\tSUBJ_03\nP1\tD3\tD2\tSUBJ_02\nP2\tD1\tD3\tSUBJ_03\n" > wasp_names.tsv
# expect: wasp_snp2h5 wasp_check_inputs wasp_remap_rna wasp_stats
# path: wasp_bams/cDNA/P1/D3.after_wasp.bam wasp_bams/cDNA/P1/stats/D3.wasp_stats.tsv bams/D2.bam wasp_bams/cDNA/P2/D3.after_wasp.bam bams/P2_D1.bam
workflow:
  start: wasp
  until: wasp
references:
  tools:
    wasp: wasp/0.3.4
modules:
  wasp:
    samples: wasp_samples.tsv
    sample_names: wasp_names.tsv
    genotypes:
      chip:
        vcf: chip_{chrom}.vcf.gz
        chrom_sizes: chrom.txt
    rna:
      remap:
        genome: star_idx/
