# vireo once per vcf column of vcf_info (vcf_type)
# expect: cellSNP vireoSNP demux_run_vireo demux_final collect_demux_versions
# path: vireoSNP/Sample_P1-cDNA/pool_vcf_gencode/donor_ids.tsv final/P1_pool_vcf_gencode_maf_25pct_final.h5ad final_demux_versions_pool_vcf.tsv
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: demux
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: true

# Parameters, output dirs and folder structures of each module
modules:
  gt_demux:
    fold_struct: "Sample_{pool}-cDNA/{vcf_type}/"
