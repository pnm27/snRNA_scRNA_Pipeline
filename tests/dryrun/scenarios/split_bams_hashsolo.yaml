# split bams by raw hashsolo output
# expect: create_inp_splitBams resolve_pool_targets run_calico_solo
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: split_bams
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: solo
    add_to_previous: null
    genotype:
      multi_vcf: false

# Parameters, output dirs and folder structures of each module
modules:
  split_bams:
    split_by:
      demux: hashsolo
      input: raw
      column: null
