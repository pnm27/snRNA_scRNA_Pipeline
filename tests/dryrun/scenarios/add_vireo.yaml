# vireo added to the hashsolo run tagged wo_gt
# expect: demux_run_vireo demux_final vireoSNP create_inp_cellSNP
# absent: demux_run_solo run_calico_solo
# path: final_count_matrix/solo/wo_gt/P1/P1-HTO_STARsolo_out.h5ad vireoSNP/w_gt/
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: demux
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: solo
    run_tag: w_gt
    genotype:
      multi_vcf: false

# Parameters, output dirs and folder structures of each module
modules:
  demultiplex:
    previous_run_tag: wo_gt
