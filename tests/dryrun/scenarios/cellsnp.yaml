# cellSNP's pileup only
# expect: cellSNP create_inp_cellSNP
# absent: vireoSNP
# path: cellSNP/Sample_P1-cDNA/cellSNP.cells.vcf.gz
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: cellsnp
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: false
