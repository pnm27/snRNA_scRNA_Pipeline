# hashsolo and vireo together, one combined h5ad
# expect: demux_run_solo demux_run_vireo demux_final collect_demux_versions vireoSNP run_calico_solo
# path: final_count_matrix/final/P1_final.h5ad info/final/final_demux_versions.tsv info/final/P1_basic_stats.tsv info/solo/P1/P1-HTO_hashsolo_stats.tsv info/vireoSNP/Sample_P1-cDNA_vireo_stats.tsv
# What to run: the aligner and the last stage ('until')
workflow:
  aligner: STARsolo
  until: demux
  picard_metrics: null

# What was sequenced and how it's multiplexed
experiment:
  demultiplexing:
    method: both
    add_to_previous: null
    genotype:
      multi_vcf: false
