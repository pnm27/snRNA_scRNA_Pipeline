# start: wasp with no sample column: the genotype IDs come from the sample
# names table (one per pool), an input of the checks and of snp2h5; no
# final_donor column in either table: a warning, no swap corrections assumed
# standalone:
# setup: rm projdir/fastq_files.txt
# setup: mkdir -p bams && touch chip_chr1.vcf.gz chip_chr2.vcf.gz && printf "chr1\t248956422\nchr2\t242193529\nchrM\t16569\n" > chrom.txt
# setup: for p in P1 P2; do touch bams/$p.bam bams/$p.bam.bai; done
# setup: printf "pool\tdonor\tbam\nP1\tP1\tbams/P1.bam\nP2\tP2\tbams/P2.bam\n" > wasp_samples.tsv
# setup: printf "pool\tsample\nP1\tSUBJ_01\nP2\tSUBJ_02\n" > wasp_names.tsv
# expect: wasp_snp2h5 wasp_check_inputs wasp_prepare_rna wasp_remap_rna wasp_finish_rna
# path: wasp_names.tsv
# says: have no final_donor column: no swap corrections assumed (final_donor = donor)
workflow:
  start: wasp
  until: wasp
references:
  tools:
    wasp: wasp/0.3.4
modules:
  wasp:
    samples: wasp_samples.tsv
    sample_names: wasp_names.tsv
    genotypes:
      chip:
        vcf: chip_{chrom}.vcf.gz
        chrom_sizes: chrom.txt
    rna:
      remap:
        genome: star_idx/
