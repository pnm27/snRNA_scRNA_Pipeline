# multiome: WASP on the per-donor bams of the RNA (GEX) part
# setup: mkdir -p geno && touch geno/snp_index.h5 geno/snp_tab.h5 geno/haps.h5
# setup: printf "pool\tdonor\tsample\nP1\tD1\tG1\nP1\tD2\tG2\n" > wasp_samples.tsv
# donors: D1 D2
# expect: bamfilt_by_CB split_bams wasp_prepare_rna wasp_remap_rna wasp_finish_rna
# path: projdir/wasp_bams/cDNA/P1/D1.after_wasp.bam projdir/wasp_bams/cDNA/P1/D2.after_wasp.bam
# says: 'references: tools: wasp_star' isn't set
workflow:
  aligner: cellranger_arc
  start: align
  until: wasp
  picard_metrics: null
  gt_check: no
experiment:
  demultiplexing:
    method: vireo
    add_to_previous: null
    genotype:
      multi_vcf: false
references:
  tools:
    wasp: wasp/0.3.4
modules:
  wasp:
    samples: wasp_samples.tsv
    genotypes:
      main:
        h5_dir: geno/
