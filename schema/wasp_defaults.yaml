# Defaults of a 'workflow: start: wasp' run (lib/config_defaults.py): WASP
# filtering of per-donor bams that are already there, e.g. split by an
# earlier run or outside the pipeline. They go over new_config.example.yaml,
# and the run's config goes over both, so it needs only what differs, e.g.
#
#   workflow:
#     start: wasp
#     until: wasp
#   references:
#     tools:
#       wasp: wasp/2021-04            # env module that sets $WASP_HOME
#       wasp_star: star/2.7.10a       # STAR module of the cDNA remap (its index's); null: star
#   modules:
#     wasp:
#       samples: wasp_samples.tsv     # pool, donor, bam[, final_donor, vcfID, bai, modality, genotype_set]
#       sample_names: names.tsv       # optional: pool, donor, final_donor, vcfID
#       genotypes:
#         main:
#           h5_dir: /path/to/snp2h5_output/
#       rna:                          # cDNA rows
#         remap:
#           genome: /path/to/STAR_index/
#           gtf: /path/to/genes.gtf
#       atac:                         # ATAC rows (multiome)
#         remap:
#           bwa_index: /path/to/cellranger-arc-ref/fasta/genome.fa
#
# (docs/source/sub_workflows.md, WASP). No alignment, demultiplexing or
# alignment metrics are run.
workflow:
  start: wasp
  until: wasp
  picard_metrics: null
  gt_check: no
experiment:
  demultiplexing:
    method: null
