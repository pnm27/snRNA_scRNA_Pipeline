# JSON schema (in YAML) for new_config.yaml, used by validate() in the Snakefile.
# Nested sections allow extra keys; only the types of known keys are checked.
$schema: https://json-schema.org/draft/2020-12/schema
description: Config of the snRNA/scRNA pipeline (new_config.yaml), in the layout of helper_py_scripts/migrate_config.py. Validated at the start of every run; defaults fill in optional keys.
type: object
required:
- references
- workflow
- experiment
- modules
properties:
  references:
    type: object
    description: Genomes, barcodes, regions and tool versions
    properties:
      barcodes:
        type: array
      genome_builds:
        type: object
        description: Reference sets, picked through YAML anchors
      STARsolo_genome_dir:
        type: object
        description: Reference sets, picked through YAML anchors
      cellranger_arc_genome_dir:
        type: object
        description: Reference sets, picked through YAML anchors
      whitelist:
        type: string
      reg_chr_bed:
        type:
        - string
        - 'null'
      chr_prefix:
        type:
        - string
        - 'null'
      mito_prefix:
        type: string
      tools:
        type: object
        properties:
          star:
            type: string
          featuremap_script:
            type: string
          star_snv_aware:
            type: string
          cellranger_arc:
            type: string
          cellranger:
            type: string
            default: cellranger/8.0.1
          wasp:
            type:
            - string
            - 'null'
            default: null
            description: "Env module of WASP (github.com/bmvdgeijn/WASP) for 'workflow: until: wasp', e.g. wasp/2021-04 (as new_config.example.yaml and migrate_config.py): it sets WASP_HOME, where its scripts are (mapping/find_intersecting_snps.py, mapping/filter_remapped_reads.py, snp2h5/snp2h5), with a python that has PyTables"
        required:
        - star
        - featuremap_script
        - star_snv_aware
        - cellranger_arc
    required:
    - barcodes
    - genome_builds
    - STARsolo_genome_dir
    - cellranger_arc_genome_dir
    - whitelist
    - reg_chr_bed
    - chr_prefix
    - mito_prefix
    - tools
  workflow:
    type: object
    description: "What to run: the aligner, the first stage (start: align runs from the fastqs, as configs without 'start' did) and the last stage (until)"
    properties:
      picard_metrics:
        type:
        - string
        - 'null'
        enum:
        - all
        - rnaseq
        - gc
        - null
      gt_check:
        type: boolean
      aligner:
        type: string
        enum:
        - STARsolo
        - cellranger
        - cellranger_arc
        description: STARsolo, cellranger (cellranger count) or cellranger_arc (cellranger-arc count, multiome)
      start:
        type: string
        enum:
        - align
        - split_bams
        - wasp
        description: "First stage to run. wasp: WASP-filter the per-donor bams listed in the WASP samples table ('modules: wasp: samples', with a bam column), with defaults from new_config.example.yaml and schema/wasp_defaults.yaml; align: from the fastqs; split_bams: split existing bams (in the aligner's bams_dir, or listed in 'split_by: external: pools') by donor labels from outside the pipeline ('modules: split_bams: split_by: input: external') or by the final h5ads of the versions in the swap correction file ('input: final', 'modules: demultiplex: swap_correction'); keys left out of such a config take the values of new_config.example.yaml with schema/split_bams_defaults.yaml on top"
      until:
        type: string
        enum:
        - align
        - cellsnp
        - demux
        - split_bams
        - identify_swaps
        - wasp
        description: "Last stage to run; the alignment (or Picard's metrics) is always a target, unless start is split_bams or wasp. cellsnp: cellSNP's pileup only; split_bams, identify_swaps and wasp include the demultiplexing, unless the bams are split by external labels; wasp: WASP filtering of the per-donor bams (cDNA: sc/snRNA-seq and multiome GEX; ATAC: multiome, with split_bams: modalities ATAC)"
    required:
    - picard_metrics
    - gt_check
    - aligner
    - start
    - until
    additionalProperties: false
  experiment:
    type: object
    description: What was sequenced and how it's multiplexed
    properties:
      demultiplexing:
        type: object
        properties:
          create_final_h5ad:
            type:
            - boolean
            - 'null'
          run_tag:
            type:
            - string
            - 'null'
            pattern: ^[A-Za-z0-9_.-]+$
            default: null
            description: Sub-folder for the outputs of this demultiplexing run (e.g. wo_gt, w_gt_2); null keeps the dirs as they are in the config
          method:
            type:
            - string
            - 'null'
            description: 'Tool run now: solo (hashsolo), vireo, both, or null (the h5ad without demultiplexing)'
            enum:
            - solo
            - vireo
            - both
            - null
          add_to_previous:
            type:
            - string
            - 'null'
            default: null
            description: "Tool of an earlier run ('modules: demultiplex: previous_run_tag') this run's method is added to"
            enum:
            - solo
            - vireo
            - null
          genotype:
            type: object
            properties:
              enabled:
                type: boolean
                description: 'Donor genotypes are used (false: vireo names the donors donor0, donor1, ...)'
              multi_vcf:
                type: boolean
                default: false
                description: One vireo run per vcf column of 'vcf_info' ('vcf_type' wildcard)
            required:
            - enabled
            additionalProperties: false
        required:
        - create_final_h5ad
        - method
        - genotype
        additionalProperties: false
      inputs:
        type: object
        properties:
          select_fastqs:
            type: string
          wildcards_select:
            type:
            - string
            - 'null'
          fastqs_dir:
            type: object
            properties:
              HTO:
                type: string
              cDNA:
                type: string
              ATAC:
                type: string
            required:
            - HTO
            - cDNA
            - ATAC
            additionalProperties: false
          R1_suffix:
            type: string
          R2_suffix:
            type: string
          multiome_suffix:
            type: string
          wet_lab_info:
            type:
            - string
            - 'null'
        required:
        - select_fastqs
        - wildcards_select
        - fastqs_dir
        - R1_suffix
        - R2_suffix
        - multiome_suffix
        - wet_lab_info
        additionalProperties: false
      qc:
        type: object
        properties:
          max_mito_percentage:
            type: integer
          min_genes_per_cell:
            type: integer
          min_cells_per_gene:
            type: integer
        required:
        - max_mito_percentage
        - min_genes_per_cell
        - min_cells_per_gene
        additionalProperties: false
      hto:
        type: object
        properties:
          enabled:
            type: boolean
            description: HTO (hashtag) libraries
          multiplexing:
            type:
            - string
            - 'null'
            default: null
            description: single (one HTO per cell) or multiple
            enum:
            - single
            - multiple
            - null
        required:
        - enabled
        additionalProperties: false
    required:
    - demultiplexing
    - inputs
    - qc
    - hto
    additionalProperties: false
  modules:
    type: object
    description: Parameters, output dirs and folder structures of each module
    properties:
      STARsolo:
        type: object
        properties:
          count_matrix:
            type: string
            enum:
            - GeneFull
            - Gene
            default: GeneFull
            description: STARsolo's count matrix used downstream (its *_matrix, *_barcodes and *_features keys)
          gene_barcodes:
            type: string
            default: _Solo.out/Gene/filtered/barcodes.tsv.gz
          bams_dir:
            type: string
          genome_pick:
            type: object
          star_params_dir:
            type: string
          umi_len:
            type: integer
          soloType:
            type: string
          solo_cell_filter:
            type: string
          wasp:
            type: boolean
            default: false
            description: STAR's WASP mode, with the per-pool vcf of gt_demux_pipeline.vcf_info
          SAM_attr:
            type: string
          features:
            type: string
          misc_reads_file:
            type: string
          bai:
            type: string
          bam:
            type: string
          STAR_log_final:
            type: string
          barcodes_stats:
            type: string
          gene_features_stats:
            type: string
          gene_features:
            type: string
          gene_matrix:
            type: string
          gene_raw_matrix:
            type: string
          gene_summary:
            type: string
          genefull_features_stats:
            type: string
          genefull_barcodes:
            type: string
          genefull_features:
            type: string
          genefull_matrix:
            type: string
          genefull_raw_matrix:
            type: string
          genefull_summary:
            type: string
          extra_params:
            type:
            - string
            - 'null'
          run_threads:
            type: integer
          fold_struct:
            type: string
        required:
        - fold_struct
      cellranger:
        type: object
        properties:
          bams_dir:
            type: string
          ref:
            type: object
            properties:
              genome:
                type: string
            required:
            - genome
          include_introns:
            type: boolean
            default: true
          extra_params:
            type:
            - string
            - 'null'
            default: null
          bam:
            type: string
            default: possorted_genome_bam.bam
          bai:
            type: string
            default: possorted_genome_bam.bam.bai
      cellranger_arc:
        type: object
        properties:
          bams_dir:
            type: string
          ref:
            type: object
          atac_fragments:
            type: string
          filtered_h5_matrix:
            type: string
          gex_bam:
            type: string
          gex_bai:
            type: string
          atac_bam:
            type: string
          atac_bai:
            type: string
          pipestance_struct:
            type: string
      picard:
        type: object
        properties:
          window_size:
            type: integer
          gc_bias_metrics:
            type: string
          gc_summary_metrics:
            type: string
          strand:
            type: string
            enum:
            - NONE
            - FIRST_READ_TRANSCRIPTION_STRAND
            - SECOND_READ_TRANSCRIPTION_STRAND
          rnaseq_metrics:
            type: string
      kite:
        type: object
        properties:
          kallisto_bustools_dir:
            type: string
          k_mer_length:
            type: integer
          chemistry:
            type: string
          columns_to_pick:
            type: array
          feature_barcodes:
            type: string
          headers:
            type:
            - boolean
            - string
          features_mismatch_fa:
            type: string
          features_mismatch_t2g:
            type: string
          features_mismatch_idx:
            type: string
          ec_matrix:
            type: string
          tx:
            type: string
          bus_file:
            type: string
          bus_file_corrected:
            type: string
          bus_file_sorted:
            type: string
          bus_count_dir:
            type: string
          bus_count_barcodes:
            type: string
          bus_count_genes:
            type: string
          bus_count_mtx:
            type: string
          fold_struct:
            type: string
        required:
        - fold_struct
      hashsolo:
        type: object
        properties:
          h5ad_bustools_dir:
            type: string
          calico_solo_dir:
            type: string
          hto_sep:
            type:
            - string
            - 'null'
          columns_to_pick:
            type: array
          SubID_convert:
            type: boolean
          final_count_matrix_dir:
            type: string
          demultiplex_info_dir:
            type: string
          bustools_h5ad:
            type: string
          calico_solo_h5ad:
            type: string
          final_count_matrix_h5ad:
            type: string
          demultiplex_info:
            type: string
          fold_struct:
            type: string
        required:
        - fold_struct
      gt_demux:
        type: object
        properties:
          cellsnp_dir:
            type: string
          inp_for_cellsnp_dir:
            type: string
          cellsnp_ref_snps:
            type:
            - string
            - 'null'
          reuse_cellsnp_dir:
            type:
            - string
            - 'null'
            default: null
            description: '''cellsnp_dir'' of a previous run, to run vireo on its cellSNP outputs'
          pool_vcf_use:
            type:
            - array
            - string
            - 'null'
            items:
              enum:
              - pileup
              - vireo
            default:
            - pileup
            - vireo
            description: 'What a per-pool vcf (4-column vcf_info) is used for: the cellSNP pileup and/or vireo'
          vcf_info:
            type:
            - string
            - 'null'
          vireosnp_dir:
            type: string
          filt_vcf_dir:
            type: string
          genome_1k_ref:
            type: string
          donor_genotype:
            type: string
          final_count_matrix_dir:
            type: string
          demultiplex_info_dir:
            type: string
          donorName_conv:
            type: object
            properties:
              file:
                type:
                - string
                - 'null'
              header_lev:
                type:
                - string
                - 'null'
              pool_col:
                type:
                - string
                - 'null'
              donor_col:
                type:
                - string
                - 'null'
              convert_col:
                type:
                - string
                - 'null'
              new_h5ad_colname:
                type:
                - string
                - 'null'
          demux_col:
            type: string
          barcode_len:
            type: integer
          include_all_cells:
            type: boolean
          doublet:
            type: string
          negative:
            type: string
          na:
            type: string
          filt_barcodes:
            type: string
          cell_tag:
            type: string
          umi_tag:
            type: string
          cellsnp_base:
            type: string
          cellsnp_cells:
            type: string
          bcftools_thread:
            type: integer
          min_aggr_count:
            type: integer
          min_maf:
            type: number
          n_proc:
            type: integer
          donors_per_pool_file:
            type:
            - string
            - 'null'
          donors_vcf:
            type: string
          donors_classification:
            type: string
          filt_vcf:
            type: string
          hash_columns:
            type: array
          vcf_info_columns:
            type: object
            properties:
              pool:
                type: string
              n_dons:
                type: string
              vcf:
                type: array
          wet_lab_file_cols:
            type: array
          vireo_donor_file_cols:
            type: array
          final_count_matrix_h5ad:
            type: string
          demultiplex_info:
            type: string
          swap_correction_df:
            type:
            - string
            - 'null'
            default: null
            description: Unused, see 'demultiplex.swap_correction'
          fold_struct:
            type: string
          fold_struct_filt_bc:
            type: string
        required:
        - fold_struct
        - fold_struct_filt_bc
      demultiplex:
        type: object
        properties:
          demux_count_matrix_dir:
            type:
            - string
            - 'null'
          final_count_matrix_h5ad:
            type: string
          demultiplex_info_dir:
            type: string
          demultiplex_info:
            type: string
          previous_run_tag:
            type:
            - string
            - 'null'
            default: null
            description: "run_tag of the earlier run that 'experiment: demultiplexing: add_to_previous' adds to"
          swap_correction:
            type: object
            default: {}
            properties:
              file:
                type:
                - string
                - 'null'
                default: null
              pool_column:
                type:
                - string
                - 'null'
                default: null
              version_column:
                type:
                - string
                - 'null'
                default: null
                description: "Demultiplex version of each pool: <tool>:<run_tag> (tool: solo, vireo or both), comma-separated for runs of two tools; or a name in 'versions'"
              donor_from:
                type:
                - string
                - 'null'
                default: null
              donor_to:
                type:
                - string
                - 'null'
                default: null
              status_column:
                type:
                - string
                - 'null'
                default: null
                description: "Column whose values other than True (yes, 1) drop that donor, as an empty donor_to does; pools with no donor kept aren't split (start: split_bams). null: every row is kept"
              versions:
                type:
                - string
                - object
                - 'null'
                default: null
                description: "What the names in version_column are: a JSON file whose 'demultiplex_paths' maps each name to its 'demux' (h5ad) dir and 'info' (stats) dir, e.g. demul_samples_annotate_h5ad_template.json; or a map of each name to <tool>:<run_tag>, or to {demux, info, tool}. The h5ad and stats file names in those dirs follow the tool's fold_struct; the tool is 'split_bams: split_by: demux' unless given. null: version_column holds <tool>:<run_tag>"
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: object
                    required: [demux]
                    properties:
                      demux: {type: string}
                      info: {type: string}
                      tool: {type: string, enum: [solo, vireo]}
                    additionalProperties: false
            if:
              properties:
                file:
                  type: string
              required:
              - file
            then:
              properties:
                pool_column:
                  type: string
                version_column:
                  type: string
                donor_from:
                  type: string
                donor_to:
                  type: string
          fold_struct:
            type: string
            default: '{pool}'
            description: Folder structure (and prefix) of the final h5ad of each pool
      split_bams:
        type: object
        properties:
          split_by:
            type: object
            properties:
              demux:
                type: string
              input:
                type: string
                pattern: (?i)^(raw|h5ad|final|external)$
                description: "raw: output of the demultiplexing tool; h5ad: its h5ad in this run; final: final h5ad of the pool; external: donor labels from outside the pipeline (see 'external')"
              column:
                type:
                - string
                - 'null'
              external:
                type: object
                description: "Donor labels from outside the pipeline (input: external): a pooled h5ad, or a table, with the donor and the pool of origin of each cell"
                additionalProperties: false
                properties:
                  file:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: "Pooled h5ad (.h5ad) or table (.csv, .tsv or .txt, tab-separated; optionally .gz), one row per cell"
                  donor_column:
                    type: string
                    default: individualID
                    description: Column (h5ad obs or table) with the donor of each cell
                  pool_column:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: Column (h5ad obs or table) with the pool of origin of each cell
                  barcode_column:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: "Column with the cell barcodes; null: the obs names (h5ad only)"
                  barcode_transformations:
                    type: array
                    items: {oneOf: [{$ref: '#/$defs/pythonic_step'}, {$ref: '#/$defs/regex_step'}]}
                    default:
                    - {type: pythonic, operation: split, by: _}
                    - {type: pythonic, operation: select_index, index: -1}
                    description: "Steps that turn the unique barcodes of the file (e.g. P12_L1_AAACCTGAGC-1) into the bam's CB tags; the default keeps the part after the last '_'. Each step is {type: pythonic, operation: ..., and its by, index, start, end, old or new} or {type: regex, pattern: ..., replacement: ...}, as in schema/demul_samples_annotate_h5ad.schema.json"
                  pool_transformations:
                    type: array
                    items: {oneOf: [{$ref: '#/$defs/pythonic_step'}, {$ref: '#/$defs/regex_step'}]}
                    default: []
                    description: "Steps that turn the pool names of the file into the {pool} names of the bams (steps as in barcode_transformations)"
                  pools:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: "Table of the bam of each pool (workflow: start: split_bams; split_by: input external or final), for bams that aren't in the aligner's bams_dir and fold_struct: columns pool, bam and optionally bai (default: <bam>.bai), and for multiome the ATAC bam, atac_bam and atac_bai (default: <atac_bam>.bai; needed with 'split_bams: modalities' ATAC; bam is then the gex bam); tab-separated, or .csv. Its pools are the {pool} names after pool_transformations. Pools of the labels (or of the swap correction file) missing from the table aren't split (a warning). The derived bams (filt_bam, short_bam) then go to 'split_bams: temp_dir'. null: the aligner's bams_dir and fold_struct"
          modalities:
            type: array
            items: {type: string, pattern: '(?i)^(cdna|atac)$'}
            minItems: 1
            default: [cDNA]
            description: "Bams split per donor: cDNA, and ATAC for multiome (aligner cellranger_arc). Every modality is split by the same donor labels: the cDNA demultiplexing, or the external labels (split_by: input external). The ATAC bams go to fold_struct_bams with '{modality}' filled with ATAC, or under an ATAC/ folder when it has none"
          min_cells_per_donor:
            type: integer
          subset_chr:
            type:
            - integer
            - string
            - 'null'
          inp_split_bams_dir:
            type: string
          bams_per_barcode_dir:
            type: string
          split_bams_dir:
            type: string
          split_bams_proxy_dir:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          reads_v_barcodes_dir:
            type: string
          temp_dir:
            type: string
          sort_temp_dir:
            type: string
          new_temp_dir:
            type: string
          split_bams_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          per_donor_split_log_dir:
            type: string
          per_donor_split_log_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          split_bams_proxy_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          new_temp_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          donor_name_converter:
            type: object
            properties:
              file:
                type:
                - string
                - 'null'
              from_column:
                type:
                - string
                - 'null'
              to_column:
                type:
                - string
                - 'null'
          demux_suffixes:
            type: object
            properties:
              vireo:
                type:
                - string
                - 'null'
              solo:
                type:
                - string
                - 'null'
          sort_cb_bam:
            type: string
          filt_bam:
            type: string
          sort_cb_bai:
            type: string
          sam:
            type: string
          bc_per_donor:
            type: integer
          time_per_donor:
            type: string
          short_bam:
            type: string
          mito_reads_file:
            type:
            - string
            - 'null'
            description: Suffix of a pool's file of mito read counts per donor,
              written next to its per-donor bams (split_bams_dir +
              fold_struct_bams + pool + this) when 'gt_check' is off. null
              for none
          fold_struct_hash:
            type: string
          fold_struct_bams:
            type: string
          fold_struct_donor:
            type: string
        required:
        - fold_struct_hash
        - fold_struct_bams
        - fold_struct_donor
      wasp:
        type: object
        description: "WASP filtering of per-donor bams ('workflow: until: wasp' or 'start: wasp'): cDNA (sc/snRNA-seq, the RNA part of multiome; 'rna') and ATAC (multiome; 'atac'); see lib/wasp.py"
        additionalProperties: false
        properties:
          samples:
            type:
            - string
            - 'null'
            default: null
            description: "Table of the donor bams to WASP-filter: columns pool, donor (as the final demultiplexing named it: the split bams' name), final_donor (optional: the donor after swap correction, which names the outputs, once per pool and modality; empty or no column: from 'sample_names', else the donor, with a warning when neither table has the column), vcfID (optional; 'sample' is read too: the genotype sample ID(s) of the final donor, ';'- or ','-separated (',' in a tab-separated table only), no whitespace: find_intersecting_snps.py's --samples; empty or no column: from 'sample_names', else the final donor's name), modality (optional: cDNA or ATAC; empty or no column: cDNA with start: wasp, else every split modality of the donor), bam and bai (start: wasp; bai defaults to <bam>.bai) and genotype_set (with several 'genotypes' sets); tab-separated, or .csv. After split_bams, split donors not in the table aren't filtered (a warning)"
          sample_names:
            type:
            - string
            - 'null'
            default: null
            description: "Optional table of the final donors (after swap correction, which so far is applied only to the h5ad files) and genotype sample ID(s) of pools or donors, for the samples table's rows with no final_donor or vcfID: columns pool, donor (optional; as the final demultiplexing named it; empty or no column: every donor of the pool; a (pool, donor) row wins over a pool's row), final_donor (optional; empty: the donor; no column: a warning, and no swap corrections assumed) and vcfID ('sample' is read too; as in the samples table); tab-separated, or .csv"
          genotypes:
            type:
            - object
            - 'null'
            default: null
            description: "Named genotype sets (e.g. one for WGS, one for SNP arrays), each WASP's h5 files (h5_dir, made by snp2h5) or VCF/BCF files converted once (vcf and chrom_sizes)"
            additionalProperties:
              type: object
              additionalProperties: false
              x-explain: "A genotype set is either 'h5_dir' (a folder with WASP's snp_index.h5, snp_tab.h5 and haps.h5) or 'vcf' (an indexed VCF/BCF, or a list of them, e.g. one per chromosome) with 'chrom_sizes' (chromosome and length, snp2h5's --chrom)"
              properties:
                h5_dir:
                  type:
                  - string
                  - 'null'
                vcf:
                  type:
                  - string
                  - array
                  - 'null'
                  items:
                    type: string
                chrom_sizes:
                  type:
                  - string
                  - 'null'
              anyOf:
              - required: [h5_dir]
                properties: {h5_dir: {type: string}}
              - required: [vcf, chrom_sizes]
                properties: {vcf: {type: [string, array], minItems: 1}, chrom_sizes: {type: string}}
          rna:
            type: object
            additionalProperties: false
            description: "WASP of the cDNA bams (sc/snRNA-seq, the RNA part of multiome; rules/wasp/rna.smk): STAR remapping, duplicates kept"
            x-explain: "'modules: wasp: rna' has 'remap' (genome, gtf, extra_params) and 'paired_end' (they were directly under 'modules: wasp' before ATAC WASP: helper_py_scripts/migrate_config.py moves them)"
            properties:
              remap:
                type: object
                additionalProperties: false
                description: "STAR remapping of the reads over SNPs"
                properties:
                  genome:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: "STAR index of the genome the bams were aligned to. null: the run's aligner reference (STARsolo's genome_pick, or the 'star' folder of the cellranger / cellranger-arc reference, which may need a newer STAR index: see docs/source/config_caveats.md); start: wasp of cDNA bams: required"
                  gtf:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: "GTF for STAR's --sjdbGTFfile; null: STARsolo's genome_pick gtf when the genome is the aligner's, else none (the index's annotations)"
                  extra_params:
                    type:
                    - string
                    - 'null'
                    default: null
              paired_end:
                type: boolean
                default: false
                description: "Paired-end GEX reads (e.g. 5' kits with both reads aligned); false for 10x 3' (only R2 has the cDNA)"
          atac:
            type: object
            additionalProperties: false
            description: "WASP of the ATAC bams (multiome, or scATAC; rules/wasp/atac.smk): paired-end, bwa-mem remapping as cellranger-arc"
            properties:
              remap:
                type: object
                additionalProperties: false
                description: "bwa-mem remapping of the pairs over SNPs"
                properties:
                  bwa_index:
                    type:
                    - string
                    - 'null'
                    default: null
                    description: "bwa-indexed fasta of the genome the bams were aligned to. null: the cellranger-arc reference's fasta/genome.fa (indexed by cellranger-arc mkref); start: wasp of ATAC bams: required"
                  extra_params:
                    type:
                    - string
                    - 'null'
                    default: "-M -Y"
                    description: "bwa mem options (as the lab's multiome runs)"
              drop_duplicates:
                type: string
                enum: [marked, none]
                default: marked
                description: "marked: remove the reads the aligner marked as duplicates (flag 0x400; cellranger-arc marks them per cell barcode) after WASP; none: keep them"
          wasp_dir:
            type: string
            default: projdir/wasp_bams/
            description: "WASP-filtered bams (<modality>/<pool>/<donor>.after_wasp.bam, modality cDNA or ATAC), their stats and logs, and the run's stats of each modality (<modality>/wasp_stats.tsv, wasp_summary.tsv, wasp_plots.pdf)"
          work_dir:
            type: string
            default: projdir/wasp_tmp/
            description: "Large temporary files of each job (<modality>/<pool>/<donor>/), removed when it ends: a place with space"
      identify_swaps:
        type: object
        properties:
          mbv_inp:
            type: string
          mbv_out_dir:
            type: string
          ref_vcf:
            type: string
          mbv_suffix:
            type: string
          mbv_extra_opt:
            type:
            - string
            - 'null'
          fold_struct:
            type: string
        required:
        - fold_struct
      deeptools:
        type: object
        properties:
          multiBamSummary:
            type: object
            properties:
              bams_dir:
                type: string
              bam:
                type: string
              outdir:
                type: string
              rep1_suffix:
                type: string
              rep2_suffix:
                type: string
              extra_params:
                type:
                - string
                - 'null'
          plotCorrelation:
            type: object
            properties:
              outdir:
                type: string
              corr_method:
                type: string
              plot_type:
                type: string
              out_fmt:
                type: string
          fold_struct:
            type: string
        required:
        - multiBamSummary
        - plotCorrelation
        - fold_struct
    required:
    - STARsolo
    - cellranger_arc
    - picard
    - kite
    - hashsolo
    - gt_demux
    - demultiplex
    - split_bams
    - identify_swaps
    - deeptools
  execution:
    type: object
    description: Rule resources
    properties:
      resources:
        type:
        - object
        - 'null'
        default: null
        description: Per-rule overrides of rules/resources.smk (memory in MB, time in minutes)
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            cpus_per_task:
              type: integer
              minimum: 1
            mem_mb: &id001
              oneOf:
              - type: integer
                minimum: 0
              - type: object
                required:
                - base
                additionalProperties: false
                properties:
                  base:
                    type: integer
                  step:
                    type: integer
                  max:
                    type: integer
                  by_vcf_suffix:
                    type: object
                    additionalProperties:
                      type: object
            time_min: *id001
    default: {}
    additionalProperties: false
additionalProperties: false

# Rules across keys. 'x-explain' (or a key's 'description') is shown with
# the error by lib/config_check.py; 'x-warnings' are only printed.
allOf:
- x-explain: "add_to_previous names the tool of the earlier run and method the tool run now, so adding to a solo (hashsolo) run means method: vireo (the old demux_type add_vireo)"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {add_to_previous: {const: solo}}, required: [add_to_previous]}}}}}
  then: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {const: vireo}}}}}}}
- x-explain: "add_to_previous names the tool of the earlier run and method the tool run now, so adding to a vireo run means method: solo (the old demux_type add_solo)"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {add_to_previous: {const: vireo}}, required: [add_to_previous]}}}}}
  then: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {const: solo}}}}}}}
- x-explain: "The earlier run that add_to_previous adds to is found by its run_tag: set 'modules: demultiplex: previous_run_tag' (null is the run without a run_tag sub-folder, so it must be set explicitly)"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {add_to_previous: {enum: [solo, vireo]}}, required: [add_to_previous]}}}}}
  then: {properties: {modules: {properties: {demultiplex: {required: [previous_run_tag], properties: {previous_run_tag: {type: string}}}}}}}
- x-explain: "Multi-VCF runs (one vireo run per vcf column of vcf_info) support only vireo, without adding to an earlier run"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {genotype: {properties: {multi_vcf: {const: true}}, required: [multi_vcf]}}}}}}}
  then: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {const: vireo}, add_to_previous: {const: null}}}}}}}
- x-explain: "Multi-VCF runs write one output per vcf column: the 'vcf_type' wildcard must be in 'modules: gt_demux: fold_struct' (e.g. Sample_{pool}-cDNA/{vcf_type}/), and 'modules: gt_demux: vcf_info_columns: vcf' must list the vcf columns"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {genotype: {properties: {multi_vcf: {const: true}}, required: [multi_vcf]}}}}}}}
  then:
    properties:
      modules:
        properties:
          gt_demux:
            properties:
              fold_struct: {pattern: "\\{vcf_type\\}"}
              vcf_info_columns:
                required: [vcf]
                properties: {vcf: {anyOf: [type: string, {type: array, minItems: 1}]}}
- x-explain: "Splitting bams (and identifying swaps or WASP) isn't supported for multi-VCF runs yet"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {genotype: {properties: {multi_vcf: {const: true}}, required: [multi_vcf]}}}}}}}
  then: {properties: {workflow: {properties: {until: {not: {enum: [split_bams, identify_swaps, wasp]}}}}}}
- x-explain: "Bams are split by the donors that demultiplexing finds, so until split_bams, identify_swaps or wasp needs a demultiplexing method (solo, vireo or both), unless they are split by external labels ('modules: split_bams: split_by: input: external') or the run starts at split_bams (existing demultiplexing) or wasp (existing per-donor bams)"
  if:
    properties:
      workflow: {properties: {until: {enum: [split_bams, identify_swaps, wasp]}, start: {not: {enum: [split_bams, wasp]}}}, required: [until]}
      modules: {properties: {split_bams: {properties: {split_by: {properties: {input: {not: {pattern: '(?i)^external$'}}}}}}}}
  then: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {enum: [solo, vireo, both]}}}}}}}
- x-explain: "hashsolo (method solo or both) isn't supported for multiome runs yet (aligner cellranger_arc)"
  if: {properties: {workflow: {properties: {aligner: {const: cellranger_arc}}, required: [aligner]}}}
  then: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {not: {enum: [solo, both]}}}}}}}}
- x-explain: "hashsolo (method solo or both) isn't supported with cellranger count yet: its cell barcodes end with '-1' and the HTO counts' (kite) don't"
  if: {properties: {workflow: {properties: {aligner: {const: cellranger}}, required: [aligner]}}}
  then: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {not: {enum: [solo, both]}}}}}}}}
- x-explain: "cellranger count runs need 'modules: cellranger' (its bams_dir and ref)"
  if: {properties: {workflow: {properties: {aligner: {const: cellranger}}, required: [aligner]}}}
  then: {properties: {modules: {required: [cellranger], properties: {cellranger: {type: object, required: [bams_dir, ref]}}}}}
- x-explain: "hashsolo (method solo or both) demultiplexes by the HTO counts: it needs 'experiment: hto: enabled: true', 'experiment: hto: multiplexing' and the wet lab file ('experiment: inputs: wet_lab_info') that maps hashtags to samples"
  if: {properties: {experiment: {properties: {demultiplexing: {properties: {method: {enum: [solo, both]}}, required: [method]}}}}}
  then:
    properties:
      experiment:
        properties:
          hto: {properties: {enabled: {const: true}, multiplexing: {enum: [single, multiple]}}, required: [multiplexing]}
          inputs: {properties: {wet_lab_info: {type: string}}}
- x-explain: "With HTO libraries, 'experiment: hto: multiplexing' picks the kite rules: single (one HTO per cell) or multiple"
  if: {properties: {experiment: {properties: {hto: {properties: {enabled: {const: true}}, required: [enabled]}}}}}
  then: {properties: {experiment: {properties: {hto: {properties: {multiplexing: {enum: [single, multiple]}}, required: [multiplexing]}}}}}
- x-explain: "start: split_bams splits bams that are already there, by donor labels from outside the pipeline ('modules: split_bams: split_by: input: external') or by the final h5ads of the demultiplexing versions in the swap correction file ('input: final'), and needs until split_bams, identify_swaps or wasp"
  if: {properties: {workflow: {properties: {start: {const: split_bams}}, required: [start]}}}
  then:
    properties:
      workflow: {properties: {until: {enum: [split_bams, identify_swaps, wasp]}}}
      modules: {properties: {split_bams: {properties: {split_by: {properties: {input: {pattern: '(?i)^(external|final)$'}}}}}}}
- x-explain: "start: split_bams with 'split_by: input: final' takes its pools and their demultiplexing versions from the swap correction file: it needs 'modules: demultiplex: swap_correction: file', 'pool_column' and 'version_column'"
  if:
    properties:
      workflow: {properties: {start: {const: split_bams}}, required: [start]}
      modules: {properties: {split_bams: {properties: {split_by: {properties: {input: {pattern: '(?i)^final$'}}, required: [input]}}, required: [split_by]}}, required: [split_bams]}
  then:
    properties:
      modules:
        required: [demultiplex]
        properties:
          demultiplex:
            required: [swap_correction]
            properties:
              swap_correction:
                required: [file, pool_column, version_column]
                properties: {file: {type: string}, pool_column: {type: string}, version_column: {type: string}}
- x-explain: "Splitting bams by external labels (split_by: input: external) needs 'split_by: external: file' (pooled h5ad or table) and 'pool_column' (the pool of origin of each cell)"
  if: {properties: {modules: {properties: {split_bams: {properties: {split_by: {properties: {input: {pattern: '(?i)^external$'}}, required: [input]}}, required: [split_by]}}, required: [split_bams]}}}
  then:
    properties:
      modules:
        properties:
          split_bams:
            properties:
              split_by:
                required: [external]
                properties:
                  external:
                    required: [file, pool_column]
                    properties: {file: {type: string}, pool_column: {type: string}}
- x-explain: "A pools table ('split_by: external: pools') lists bams that are already there, so it needs 'workflow: start: split_bams' (with start: align the aligner writes the bams in its bams_dir)"
  if: {properties: {modules: {properties: {split_bams: {properties: {split_by: {properties: {external: {properties: {pools: {type: string}}, required: [pools]}}, required: [external]}}, required: [split_by]}}, required: [split_bams]}}}
  then: {properties: {workflow: {properties: {start: {const: split_bams}}, required: [start]}}}
- x-explain: "Only multiome runs ('workflow: aligner: cellranger_arc') have an ATAC bam to split ('modules: split_bams: modalities')"
  if: {properties: {modules: {properties: {split_bams: {properties: {modalities: {contains: {pattern: '(?i)^atac$'}}}, required: [modalities]}}, required: [split_bams]}}}
  then: {properties: {workflow: {properties: {aligner: {pattern: '(?i)^cellranger_arc$'}}, required: [aligner]}}}
- x-explain: "start: wasp WASP-filters the per-donor bams of the samples table, so it needs until: wasp"
  if: {properties: {workflow: {properties: {start: {const: wasp}}, required: [start]}}}
  then: {properties: {workflow: {properties: {until: {const: wasp}}}}}
- x-explain: "WASP (until: wasp) needs the WASP env module ('references: tools: wasp', which sets WASP_HOME), a samples table ('modules: wasp: samples': pool, donor, sample, and bam with start: wasp) and at least one genotype set ('modules: wasp: genotypes')"
  if: {properties: {workflow: {properties: {until: {const: wasp}}, required: [until]}}}
  then:
    properties:
      references: {properties: {tools: {required: [wasp], properties: {wasp: {type: string}}}}}
      modules:
        required: [wasp]
        properties:
          wasp:
            required: [samples, genotypes]
            properties: {samples: {type: string}, genotypes: {type: object, minProperties: 1}}
- x-explain: "WASP after split_bams filters the final per-donor bams (all chromosomes, cells filtered), so it needs 'workflow: gt_check: no' (gt_check bams are for the genotype check)"
  if: {properties: {workflow: {properties: {until: {const: wasp}, start: {not: {const: wasp}}}, required: [until]}}}
  then: {properties: {workflow: {properties: {gt_check: {const: false}}}}}
x-warnings:
- x-warn: "Picard runs on STARsolo runs only: 'workflow: picard_metrics' is ignored for this aligner"
  if: {properties: {workflow: {properties: {aligner: {enum: [cellranger, cellranger_arc]}}, required: [aligner]}}}
  then: {properties: {workflow: {properties: {picard_metrics: {const: null}}}}}

# Transformation steps of split_by: external. Copied from
# schema/demul_samples_annotate_h5ad.schema.json ($defs), as the config
# is checked without resolving other files; tests/unit/test_config_check.py
# checks that the copies are the same
$defs:
  pythonic_step:
    title: Pythonic Transformation
    type: object
    required:
    - type
    - operation
    properties:
      type:
        const: pythonic
      operation:
        type: string
        enum:
        - lower
        - upper
        - title
        - strip
        - rstrip
        - lstrip
        - replace
        - split
        - join
        - select_index
        - select_range
      by:
        type: string
        description: Delimiter used for split or join
      index:
        type: integer
        description: Index used for select_index
      start:
        type: integer
        description: Start index for select_range
      end:
        type: integer
        description: End index for select_range
      old:
        type: string
        description: Old substring for replace
      new:
        type: string
        description: Replacement substring
    allOf:
    - if:
        properties:
          operation:
            const: split
      then:
        required:
        - by
    - if:
        properties:
          operation:
            const: join
      then:
        required:
        - by
    - if:
        properties:
          operation:
            const: select_index
      then:
        required:
        - index
    - if:
        properties:
          operation:
            const: select_range
      then:
        anyOf:
        - required:
          - start
        - required:
          - end
    - if:
        properties:
          operation:
            const: replace
      then:
        required:
        - old
        - new
  regex_step:
    title: Regex Transformation
    type: object
    required:
    - type
    - pattern
    - replacement
    properties:
      type:
        const: regex
      pattern:
        type: string
      replacement:
        type: string
      flags:
        type: string
        description: Regex flags such as IGNORECASE
