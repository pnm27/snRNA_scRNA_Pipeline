# JSON schema (in YAML) for new_config.yaml, used by validate() in the Snakefile.
# Nested sections allow extra keys; only the types of known keys are checked.
$schema: https://json-schema.org/draft/2020-12/schema
description: Config of the snRNA/scRNA pipeline (new_config.yaml), in the layout of helper_py_scripts/migrate_config.py. Validated at the start of every run; defaults fill in optional keys.
type: object
required:
- references
- workflow
- experiment
- modules
properties:
  references:
    type: object
    description: Genomes, barcodes, regions and tool versions
    properties:
      barcodes:
        type: array
      genome_builds:
        type: object
        description: Reference sets, picked through YAML anchors
      STARsolo_genome_dir:
        type: object
        description: Reference sets, picked through YAML anchors
      cellranger_arc_genome_dir:
        type: object
        description: Reference sets, picked through YAML anchors
      whitelist:
        type: string
      reg_chr_bed:
        type:
        - string
        - 'null'
      chr_prefix:
        type:
        - string
        - 'null'
      mito_prefix:
        type: string
      tools:
        type: object
        properties:
          star:
            type: string
          featuremap_script:
            type: string
          star_snv_aware:
            type: string
          cellranger_arc:
            type: string
          cellranger:
            type: string
            default: cellranger/8.0.1
        required:
        - star
        - featuremap_script
        - star_snv_aware
        - cellranger_arc
    required:
    - barcodes
    - genome_builds
    - STARsolo_genome_dir
    - cellranger_arc_genome_dir
    - whitelist
    - reg_chr_bed
    - chr_prefix
    - mito_prefix
    - tools
  workflow:
    type: object
    description: 'What to run: the aligner and the last stage'
    properties:
      picard_metrics:
        type:
        - string
        - 'null'
        enum:
        - all
        - rnaseq
        - gc
        - null
      gt_check:
        type: boolean
      aligner:
        type: string
        enum:
        - STARsolo
        - cellranger
        - cellranger_arc
        description: STARsolo, cellranger (cellranger count) or cellranger_arc (cellranger-arc count, multiome)
      until:
        type: string
        enum:
        - align
        - cellsnp
        - demux
        - split_bams
        - identify_swaps
        description: "Last stage to run; the alignment (or Picard's metrics) is always a target. cellsnp: cellSNP's pileup only; split_bams and identify_swaps include the demultiplexing"
    required:
    - picard_metrics
    - gt_check
    - aligner
    - until
  experiment:
    type: object
    description: What was sequenced and how it's multiplexed
    properties:
      demultiplexing:
        type: object
        properties:
          create_final_h5ad:
            type:
            - boolean
            - 'null'
          run_tag:
            type:
            - string
            - 'null'
            pattern: ^[A-Za-z0-9_.-]+$
            default: null
            description: Sub-folder for the outputs of this demultiplexing run (e.g. wo_gt, w_gt_2); null keeps the dirs as they are in the config
          method:
            type:
            - string
            - 'null'
            pattern: (?i)^(none|null|solo|vireo|both)$
            description: null (or none) creates the h5ad without demultiplexing
          add_to_previous:
            type:
            - string
            - 'null'
            pattern: (?i)^(solo|vireo)$
            default: null
            description: "Tool of an earlier run ('modules: demultiplex: previous_run_tag') this run's method is added to"
          genotype:
            type: object
            properties:
              enabled:
                type: boolean
                description: 'Donor genotypes are used (false: vireo names the donors donor0, donor1, ...)'
              multi_vcf:
                type: boolean
                default: false
                description: One vireo run per vcf column of 'vcf_info' ('vcf_type' wildcard)
            required:
            - enabled
        required:
        - create_final_h5ad
        - method
        - genotype
      inputs:
        type: object
        properties:
          select_fastqs:
            type: string
          wildcards_select:
            type:
            - string
            - 'null'
          fastqs_dir:
            type: object
            properties:
              HTO:
                type: string
              cDNA:
                type: string
              ATAC:
                type: string
            required:
            - HTO
            - cDNA
            - ATAC
          R1_suffix:
            type: string
          R2_suffix:
            type: string
          multiome_suffix:
            type: string
          wet_lab_info:
            type:
            - string
            - 'null'
        required:
        - select_fastqs
        - wildcards_select
        - fastqs_dir
        - R1_suffix
        - R2_suffix
        - multiome_suffix
        - wet_lab_info
      qc:
        type: object
        properties:
          max_mito_percentage:
            type: integer
          min_genes_per_cell:
            type: integer
          min_cells_per_gene:
            type: integer
        required:
        - max_mito_percentage
        - min_genes_per_cell
        - min_cells_per_gene
      hto:
        type: object
        properties:
          enabled:
            type: boolean
            description: HTO (hashtag) libraries
          multiplexing:
            type:
            - string
            - 'null'
            pattern: (?i)^(single|multiple)$
            default: null
            description: single (one HTO per cell) or multiple
        required:
        - enabled
    required:
    - demultiplexing
    - inputs
    - qc
    - hto
  modules:
    type: object
    description: Parameters, output dirs and folder structures of each module
    properties:
      STARsolo:
        type: object
        properties:
          count_matrix:
            type: string
            enum:
            - GeneFull
            - Gene
            default: GeneFull
            description: STARsolo's count matrix used downstream (its *_matrix, *_barcodes and *_features keys)
          gene_barcodes:
            type: string
            default: _Solo.out/Gene/filtered/barcodes.tsv.gz
          bams_dir:
            type: string
          genome_pick:
            type: object
          star_params_dir:
            type: string
          umi_len:
            type: integer
          soloType:
            type: string
          solo_cell_filter:
            type: string
          wasp:
            type: boolean
            default: false
            description: STAR's WASP mode, with the per-pool vcf of gt_demux_pipeline.vcf_info
          SAM_attr:
            type: string
          features:
            type: string
          misc_reads_file:
            type: string
          bai:
            type: string
          bam:
            type: string
          STAR_log_final:
            type: string
          barcodes_stats:
            type: string
          gene_features_stats:
            type: string
          gene_features:
            type: string
          gene_matrix:
            type: string
          gene_raw_matrix:
            type: string
          gene_summary:
            type: string
          genefull_features_stats:
            type: string
          genefull_barcodes:
            type: string
          genefull_features:
            type: string
          genefull_matrix:
            type: string
          genefull_raw_matrix:
            type: string
          genefull_summary:
            type: string
          extra_params:
            type:
            - string
            - 'null'
          run_threads:
            type: integer
          fold_struct:
            type: string
        required:
        - fold_struct
      cellranger:
        type: object
        properties:
          bams_dir:
            type: string
          ref:
            type: object
            properties:
              genome:
                type: string
            required:
            - genome
          include_introns:
            type: boolean
            default: true
          extra_params:
            type:
            - string
            - 'null'
            default: null
          bam:
            type: string
            default: possorted_genome_bam.bam
          bai:
            type: string
            default: possorted_genome_bam.bam.bai
      cellranger_arc:
        type: object
        properties:
          bams_dir:
            type: string
          ref:
            type: object
          atac_fragments:
            type: string
          filtered_h5_matrix:
            type: string
          gex_bam:
            type: string
          gex_bai:
            type: string
          atac_bam:
            type: string
          atac_bai:
            type: string
          pipestance_struct:
            type: string
      picard:
        type: object
        properties:
          window_size:
            type: integer
          gc_bias_metrics:
            type: string
          gc_summary_metrics:
            type: string
          strand:
            type: string
            enum:
            - NONE
            - FIRST_READ_TRANSCRIPTION_STRAND
            - SECOND_READ_TRANSCRIPTION_STRAND
          rnaseq_metrics:
            type: string
      kite:
        type: object
        properties:
          kallisto_bustools_dir:
            type: string
          k_mer_length:
            type: integer
          chemistry:
            type: string
          columns_to_pick:
            type: array
          feature_barcodes:
            type: string
          headers:
            type:
            - boolean
            - string
          features_mismatch_fa:
            type: string
          features_mismatch_t2g:
            type: string
          features_mismatch_idx:
            type: string
          ec_matrix:
            type: string
          tx:
            type: string
          bus_file:
            type: string
          bus_file_corrected:
            type: string
          bus_file_sorted:
            type: string
          bus_count_dir:
            type: string
          bus_count_barcodes:
            type: string
          bus_count_genes:
            type: string
          bus_count_mtx:
            type: string
          fold_struct:
            type: string
        required:
        - fold_struct
      hashsolo:
        type: object
        properties:
          h5ad_bustools_dir:
            type: string
          calico_solo_dir:
            type: string
          hto_sep:
            type:
            - string
            - 'null'
          columns_to_pick:
            type: array
          SubID_convert:
            type: boolean
          final_count_matrix_dir:
            type: string
          demultiplex_info_dir:
            type: string
          bustools_h5ad:
            type: string
          calico_solo_h5ad:
            type: string
          final_count_matrix_h5ad:
            type: string
          demultiplex_info:
            type: string
          fold_struct:
            type: string
        required:
        - fold_struct
      gt_demux:
        type: object
        properties:
          cellsnp_dir:
            type: string
          inp_for_cellsnp_dir:
            type: string
          cellsnp_ref_snps:
            type:
            - string
            - 'null'
          reuse_cellsnp_dir:
            type:
            - string
            - 'null'
            default: null
            description: '''cellsnp_dir'' of a previous run, to run vireo on its cellSNP outputs'
          pool_vcf_use:
            type:
            - array
            - string
            - 'null'
            items:
              enum:
              - pileup
              - vireo
            default:
            - pileup
            - vireo
            description: 'What a per-pool vcf (4-column vcf_info) is used for: the cellSNP pileup and/or vireo'
          vcf_info:
            type:
            - string
            - 'null'
          vireosnp_dir:
            type: string
          filt_vcf_dir:
            type: string
          genome_1k_ref:
            type: string
          donor_genotype:
            type: string
          final_count_matrix_dir:
            type: string
          demultiplex_info_dir:
            type: string
          donorName_conv:
            type: object
            properties:
              file:
                type:
                - string
                - 'null'
              header_lev:
                type:
                - string
                - 'null'
              pool_col:
                type:
                - string
                - 'null'
              donor_col:
                type:
                - string
                - 'null'
              convert_col:
                type:
                - string
                - 'null'
              new_h5ad_colname:
                type:
                - string
                - 'null'
          demux_col:
            type: string
          barcode_len:
            type: integer
          include_all_cells:
            type: boolean
          doublet:
            type: string
          negative:
            type: string
          na:
            type: string
          filt_barcodes:
            type: string
          cell_tag:
            type: string
          umi_tag:
            type: string
          cellsnp_base:
            type: string
          cellsnp_cells:
            type: string
          bcftools_thread:
            type: integer
          min_aggr_count:
            type: integer
          min_maf:
            type: number
          n_proc:
            type: integer
          donors_per_pool_file:
            type:
            - string
            - 'null'
          donors_vcf:
            type: string
          donors_classification:
            type: string
          filt_vcf:
            type: string
          hash_columns:
            type: array
          vcf_info_columns:
            type: object
            properties:
              pool:
                type: string
              n_dons:
                type: string
              vcf:
                type: array
          wet_lab_file_cols:
            type: array
          vireo_donor_file_cols:
            type: array
          final_count_matrix_h5ad:
            type: string
          demultiplex_info:
            type: string
          swap_correction_df:
            type:
            - string
            - 'null'
            default: null
            description: Unused, see 'demultiplex.swap_correction'
          fold_struct:
            type: string
          fold_struct_filt_bc:
            type: string
        required:
        - fold_struct
        - fold_struct_filt_bc
      demultiplex:
        type: object
        properties:
          demux_count_matrix_dir:
            type:
            - string
            - 'null'
          final_count_matrix_h5ad:
            type: string
          demultiplex_info_dir:
            type: string
          demultiplex_info:
            type: string
          previous_run_tag:
            type:
            - string
            - 'null'
            default: null
            description: run_tag of the earlier run that add_solo/add_vireo adds to
          swap_correction:
            type: object
            default: {}
            properties:
              file:
                type:
                - string
                - 'null'
                default: null
              pool_column:
                type:
                - string
                - 'null'
                default: null
              version_column:
                type:
                - string
                - 'null'
                default: null
                description: 'Demultiplex version of each pool: <tool>:<run_tag> (tool: solo, vireo or both), comma-separated for runs of two tools'
              donor_from:
                type:
                - string
                - 'null'
                default: null
              donor_to:
                type:
                - string
                - 'null'
                default: null
            if:
              properties:
                file:
                  type: string
              required:
              - file
            then:
              properties:
                pool_column:
                  type: string
                version_column:
                  type: string
                donor_from:
                  type: string
                donor_to:
                  type: string
          fold_struct:
            type: string
            default: '{pool}'
            description: Folder structure (and prefix) of the final h5ad of each pool
      split_bams:
        type: object
        properties:
          split_by:
            type: object
            properties:
              demux:
                type: string
              input:
                type: string
                pattern: (?i)^(raw|h5ad|final)$
              column:
                type:
                - string
                - 'null'
          min_cells_per_donor:
            type: integer
          subset_chr:
            type:
            - integer
            - string
            - 'null'
          inp_split_bams_dir:
            type: string
          bams_per_barcode_dir:
            type: string
          split_bams_dir:
            type: string
          split_bams_proxy_dir:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          reads_v_barcodes_dir:
            type: string
          temp_dir:
            type: string
          sort_temp_dir:
            type: string
          new_temp_dir:
            type: string
          split_bams_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          per_donor_split_log_dir:
            type: string
          per_donor_split_log_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          split_bams_proxy_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          new_temp_dir2:
            type: string
            description: Unused (split bams go to gt_check/ or final/ sub-folders)
          donor_name_converter:
            type: object
            properties:
              file:
                type:
                - string
                - 'null'
              from_column:
                type:
                - string
                - 'null'
              to_column:
                type:
                - string
                - 'null'
          demux_suffixes:
            type: object
            properties:
              vireo:
                type:
                - string
                - 'null'
              solo:
                type:
                - string
                - 'null'
          sort_cb_bam:
            type: string
          filt_bam:
            type: string
          sort_cb_bai:
            type: string
          sam:
            type: string
          bc_per_donor:
            type: integer
          time_per_donor:
            type: string
          short_bam:
            type: string
          mito_reads_file:
            type:
            - string
            - 'null'
          fold_struct_hash:
            type: string
          fold_struct_bams:
            type: string
          fold_struct_donor:
            type: string
        required:
        - fold_struct_hash
        - fold_struct_bams
        - fold_struct_donor
      identify_swaps:
        type: object
        properties:
          mbv_inp:
            type: string
          mbv_out_dir:
            type: string
          ref_vcf:
            type: string
          mbv_suffix:
            type: string
          mbv_extra_opt:
            type:
            - string
            - 'null'
          fold_struct:
            type: string
        required:
        - fold_struct
      deeptools:
        type: object
        properties:
          multiBamSummary:
            type: object
            properties:
              bams_dir:
                type: string
              bam:
                type: string
              outdir:
                type: string
              rep1_suffix:
                type: string
              rep2_suffix:
                type: string
              extra_params:
                type:
                - string
                - 'null'
          plotCorrelation:
            type: object
            properties:
              outdir:
                type: string
              corr_method:
                type: string
              plot_type:
                type: string
              out_fmt:
                type: string
          fold_struct:
            type: string
        required:
        - multiBamSummary
        - plotCorrelation
        - fold_struct
    required:
    - STARsolo
    - cellranger_arc
    - picard
    - kite
    - hashsolo
    - gt_demux
    - demultiplex
    - split_bams
    - identify_swaps
    - deeptools
  execution:
    type: object
    description: Rule resources
    properties:
      resources:
        type:
        - object
        - 'null'
        default: null
        description: Per-rule overrides of rules/resources.smk (memory in MB, time in minutes)
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            cpus_per_task:
              type: integer
              minimum: 1
            mem_mb: &id001
              oneOf:
              - type: integer
                minimum: 0
              - type: object
                required:
                - base
                additionalProperties: false
                properties:
                  base:
                    type: integer
                  step:
                    type: integer
                  max:
                    type: integer
                  by_vcf_suffix:
                    type: object
                    additionalProperties:
                      type: object
            time_min: *id001
    default: {}
